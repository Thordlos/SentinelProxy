enabled: true
fail_closed: true
score_threshold: 0
max_text_length: 1048576
cache_ttl_hours: 24
state_dir: logs/masking
code_style: typed
code_prefix: ENT
code_length: 6
log_raw_requests: true
default_operator:
    type: symbolize
built_in_entities:
    - type: ID_CARD
      name: 中国大陆身份证
      enabled: true
      operator:
        type: symbolize
    - type: PHONE_NUMBER
      name: 中国大陆手机号
      enabled: true
      operator:
        type: symbolize
    - type: EMAIL_ADDRESS
      name: 电子邮箱
      enabled: true
      operator:
        type: symbolize
    - type: BANK_CARD
      name: 银行卡号
      enabled: true
      operator:
        type: symbolize
    - type: LICENSE_PLATE
      name: 中国车牌号
      enabled: true
      operator:
        type: symbolize
    - type: IP_ADDRESS
      name: IPv4 地址
      enabled: true
      operator:
        type: randomize
        ip_random_preserve_scope: true
        ip_random_cross_class: true
        ip_random_preserve_bits: 0
static_rules: []
dynamic_rules: []
